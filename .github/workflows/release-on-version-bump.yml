name: Release on version bump

# Deliberately lightweight: single ubuntu-latest job, no matrix, no setup-python
# step, and one release path. Native plug-ins are built by build-plugins.yml and
# committed back to main before this workflow packages a version bump.

on:
  push:
    branches: [main]
    paths:
      - "TheKeyMachine/version"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-on-version-bump-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    # sync_version_metadata.py can write TheKeyMachine/version itself now
    # (e.g. when __init__.py's __version__ was bumped by hand and is newer),
    # and the "Commit normalized metadata" step below pushes that -- which
    # would match this workflow's own path filter and re-trigger it. Skip
    # runs the bot's own commit would cause.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize version, stage, build, codename and README badge
        id: sync
        run: python3 scripts/release/sync_version_metadata.py >> "$GITHUB_OUTPUT"

      - name: Commit normalized metadata
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: sync version metadata to ${{ steps.sync.outputs.version }}"
            git push
          fi

      - name: Render changelog entry as release notes
        env:
          VERSION: ${{ steps.sync.outputs.version }}
        run: |
          previous_tag="$(git describe --tags --match 'TKM-*' --abbrev=0 HEAD^ 2>/dev/null || true)"
          args=("$VERSION")
          if [[ -n "$previous_tag" ]]; then
            args+=(--previous-version "${previous_tag#TKM-}")
          fi
          python3 scripts/release/render_release_notes.py "${args[@]}" > release_notes.md

      - name: Build release zip
        run: python3 scripts/release/build_release_zip.py "${{ steps.sync.outputs.version }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.sync.outputs.version }}
        run: |
          tag="TKM-${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "TheKeyMachine ${VERSION}" --notes-file release_notes.md
          else
            gh release create "$tag" --title "TheKeyMachine ${VERSION}" --notes-file release_notes.md
          fi
          gh release upload "$tag" "dist/TKM-${VERSION}.zip" --clobber

      - name: Read GitHub release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/releases?per_page=100" > release_metadata.json

      - name: Checkout website branch
        uses: actions/checkout@v7
        with:
          ref: website
          path: website-branch

      - name: Generate website release data
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/release/update_website_release_data.py \
            website-branch \
            --release-metadata release_metadata.json \
            --repository "$REPOSITORY"

      - name: Sync Standard workspace tools to website
        run: python3 scripts/release/update_website_tool_data.py website-branch

      - name: Commit website update
        working-directory: website-branch
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html changelog/index.html releases.json tools.json toolbar.js icons movies
            git commit -m "Update website for TKM-${{ steps.sync.outputs.version }}"
            git push origin HEAD:website
          fi
